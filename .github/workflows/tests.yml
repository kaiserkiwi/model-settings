name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']

    name: PHP ${{ matrix.php }} – Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          # Laravel 11 no longer receives security patches, so every one of its releases
          # carries unfixed advisories and Composer refuses to resolve them at all. The
          # package still supports Laravel 11, so the block is lifted for this job only -
          # keeping it on for 12 and 13 means a future advisory there still gets noticed.
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            composer config policy.advisories.block false
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction

      - name: Run tests
        run: composer test
